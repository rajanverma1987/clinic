# =============================================================================
# Docker Compose Configuration for Clinic SaaS
# =============================================================================
# This compose file sets up the complete application stack:
# - Next.js application
# - MongoDB database
# - Redis cache
# - TURN server (for telemedicine)
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Application - Next.js Clinic App
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ../..
      dockerfile: apps/clinic/Dockerfile
    container_name: clinic-app
    restart: unless-stopped
    ports:
      - "5053:5053"
    environment:
      # Database
      MONGODB_URI: mongodb://mongo:27017/clinic_dev

      # Redis
      REDIS_URL: redis://redis:6379

      # Application
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5053
      HOSTNAME: 0.0.0.0

      # URLs (update for production)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:5053}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5053/api}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5053}

      # Secrets (CHANGE IN PRODUCTION!)
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # TURN server (for telemedicine)
      NEXT_PUBLIC_TURN_SERVER_URL: turn:coturn:3478
      NEXT_PUBLIC_TURN_USERNAME: ${TURN_USERNAME:-telemedicine}
      NEXT_PUBLIC_TURN_CREDENTIAL: ${TURN_PASSWORD:-changeme}

    depends_on:
      - mongo
      - redis
    networks:
      - clinic-network
    volumes:
      # Mount for file uploads (optional)
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5053/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Database - MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: clinic-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: clinic_dev
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      # Initialize database with indexes
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Cache - Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: clinic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # TURN Server - Coturn (for telemedicine WebRTC)
  # ---------------------------------------------------------------------------
  coturn:
    image: coturn/coturn:latest
    container_name: clinic-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-65535:49152-65535/udp"
    environment:
      # TURN server configuration
      TURN_USERNAME: ${TURN_USERNAME:-telemedicine}
      TURN_PASSWORD: ${TURN_PASSWORD:-changeme}
    command: >
      -n
      --log-file=stdout
      --listening-port=3478
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME:-telemedicine}:${TURN_PASSWORD:-changeme}
      --realm=clinic.local
      --min-port=49152
      --max-port=65535
      --no-cli
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3478"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Nginx - Reverse Proxy (optional, for production)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: clinic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - clinic-network
    profiles:
      - production

# =============================================================================
# Networks
# =============================================================================
networks:
  clinic-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local
  uploads:
    driver: local
